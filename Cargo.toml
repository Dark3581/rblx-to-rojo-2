[package]
name = "rbxlx-to-rojo"
version = "1.2.0"
authors = ["Kampfkarren", "Dark3581"]
description = "Convert Roblox place and model files into Rojo projects (maintained fork of rbxlx-to-rojo)"
repository = "https://github.com/Dark3581/rblx-to-rojo-2"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "rbxlx_to_rojo"
path = "src/lib.rs"

[[bin]]
name = "rbxlx-to-rojo"
path = "src/cli.rs"
required-features = ["cli"]

[dependencies]
env_logger = "0.11"
lazy_static = "1.4"
log = "0.4"
rbx_binary = "3.0.0"
rbx_dom_weak = "4.2.0"
rbx_reflection = "7.0.0"
rbx_reflection_database = "3.0.0"
rbx_xml = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (native file dialogs)
rfd = { version = "0.15", optional = true }

[dev-dependencies]
pretty_assertions = "1"

[features]
cli = ["rfd"]
